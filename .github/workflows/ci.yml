name: CI

on:
  push:
    branches:
      - main
      - 'wip/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false

      - name: Public privacy scan
        run: bash scripts/public_privacy_scan.sh

      - name: Version consistency check
        shell: bash
        run: |
          set -euo pipefail
          declared="$(cat VERSION)"
          embedded="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/buildinfo/version.go)"
          test -n "$embedded"
          if [ "$declared" != "$embedded" ]; then
            echo "version drift: VERSION=$declared buildinfo=$embedded"
            exit 1
          fi

      - name: Module tidy check
        shell: bash
        run: |
          go mod tidy
          changes="$(git status --porcelain -- go.mod go.sum)"
          if [ -n "$changes" ]; then
            echo "go.mod/go.sum are not tidy:"
            printf '%s\n' "$changes"
            echo
            git diff -- go.mod || true
            if [ -f go.sum ]; then
              echo "----- go.sum -----"
              cat go.sum
              echo "----- end go.sum -----"
            fi
            exit 1
          fi

      - name: Format check
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            printf '%s\n' "$files"
            echo
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...


  linux-amd64-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false

      - name: Build dev.24 binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '0.1.0-dev.24'
          mkdir -p out
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o out/sentinel-control ./cmd/sentinel-control
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o out/sentinel-egress-policy ./cmd/sentinel-egress-policy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o out/sentinel-github-relay ./cmd/sentinel-github-relay
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o out/tethys-sentinel-exec ./cmd/tethys-sentinel-exec
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o out/tethys-sentinel-consume ./cmd/tethys-sentinel-consume
          (
            cd out
            sha256sum \
              sentinel-control \
              sentinel-egress-policy \
              sentinel-github-relay \
              tethys-sentinel-exec \
              tethys-sentinel-consume > SHA256SUMS
          )
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "version=$(cat VERSION)"
            go version
          } > out/BUILDINFO.txt

      - name: Upload linux amd64 deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev24-linux-amd64
          if-no-files-found: error
          retention-days: 1
          path: |
            out/sentinel-control
            out/sentinel-egress-policy
            out/sentinel-github-relay
            out/tethys-sentinel-exec
            out/tethys-sentinel-consume
            out/SHA256SUMS
            out/BUILDINFO.txt


  ansible-onboarding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned Ansible core
        run: python -m pip install --disable-pip-version-check 'ansible-core==2.19.3'

      - name: Syntax-check target onboarding playbook
        working-directory: ansible
        run: ansible-playbook --syntax-check -i inventory/example.yml playbooks/onboard-sentinel-targets.yml

  chatgpt-relay-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate skills-only plugin package
        shell: bash
        run: |
          set -euo pipefail
          root='plugins/tethys-sentinel-github-relay'
          python -m json.tool "$root/plugin.json" >/dev/null
          test -f "$root/skills/tethys-sentinel-github-relay/SKILL.md"
          python -m py_compile             "$root/skills/tethys-sentinel-github-relay/scripts/sign_request.py"             "$root/skills/tethys-sentinel-github-relay/scripts/verify_relay.py"
          actual="$(
            printf '%s' '{"secret":"tsr_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA","session_id":"sgr_abcdefghijklmnop","sequence":1,"request_id":"request-0001","target":"target-test","argv":["id"],"agent_reason":"acceptance","timeout_seconds":60}' |
              python "$root/skills/tethys-sentinel-github-relay/scripts/sign_request.py" |
              tail -n 1
          )"
          expected='{"version":1,"session_id":"sgr_abcdefghijklmnop","sequence":1,"request_id":"request-0001","target":"target-test","argv":["id"],"agent_reason":"acceptance","timeout_seconds":60,"mac":"h1_JUZ5EQ6w9eDMKOSSZuT3u_7iymcCTI37Pmx6ZRtyyE8"}'
          test "$actual" = "$expected"

          python - "$root/skills/tethys-sentinel-github-relay/scripts/verify_relay.py" <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import subprocess
          import sys

          verifier = sys.argv[1]
          secret = "tsr_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          key = base64.urlsafe_b64decode(secret[4:] + "=")
          payload = {
              "actor_id": 120008285,
              "exact_argv": ["id"],
              "expires_at": "2026-09-23T04:30:00Z",
              "issue_number": 17,
              "max_commands": 1,
              "output_limit_bytes": 8192,
              "publish_output": True,
              "repository_id": 123456789,
              "session_id": "sgr_abcdefghijklmnop",
              "target": "target-test",
              "version": 1,
          }
          canonical = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()
          mac = "h1_" + base64.urlsafe_b64encode(hmac.new(key, canonical, hashlib.sha256).digest()).decode().rstrip("=")
          wire = dict(payload)
          wire["mac"] = mac
          comment = "TETHYS_SENTINEL_RELAY_AUTHORIZED_V1\n" + json.dumps(wire, ensure_ascii=False, separators=(",", ":"))

          def verify(author_id=9001, author_type="Bot", body=comment):
              data = json.dumps({
                  "secret": secret,
                  "comment": body,
                  "expected_author_id": 9001,
                  "comment_author_id": author_id,
                  "comment_author_type": author_type,
              })
              return subprocess.run([sys.executable, verifier], input=data, text=True, capture_output=True)

          ok = verify()
          if ok.returncode != 0 or '"mac_verified": true' not in ok.stdout or '"relay_actor_verified": true' not in ok.stdout:
              raise SystemExit("valid relay authorization failed verification: " + ok.stderr)
          if verify(author_id=9002).returncode == 0:
              raise SystemExit("wrong GitHub App actor ID was accepted")
          if verify(author_type="User").returncode == 0:
              raise SystemExit("non-Bot relay author was accepted")

          injected = dict(wire)
          injected["instructions"] = "unsigned attacker-controlled text"
          injected_comment = "TETHYS_SENTINEL_RELAY_AUTHORIZED_V1\n" + json.dumps(injected, ensure_ascii=False, separators=(",", ":"))
          if verify(body=injected_comment).returncode == 0:
              raise SystemExit("unsigned/unknown relay JSON field was accepted")
          PY

      - name: Package ChatGPT relay plugin
        shell: bash
        run: |
          set -euo pipefail
          cd plugins/tethys-sentinel-github-relay
          zip -qr ../../tethys-sentinel-github-relay-plugin.zip .

      - name: Upload ChatGPT relay plugin
        uses: actions/upload-artifact@v4
        with:
          name: tethys-sentinel-github-relay-plugin
          if-no-files-found: error
          retention-days: 1
          path: tethys-sentinel-github-relay-plugin.zip


  operator-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'

      - name: Resolve and verify pinned frontend dependency graph
        working-directory: web/operator
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.20.0'
          test "$(npm --version)" = '11.19.0'
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          expected='5a2ff2938d6b4ac306965054c3eef77b49b233f90f36f149a5aae57094c57762'
          actual="$(sha256sum package-lock.json | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "frontend dependency graph drift: expected=${expected} actual=${actual}"
            node <<'NODE'
          const lock = require('./package-lock.json');
          const rows = Object.entries(lock.packages || {})
            .filter(([path, meta]) => path && meta && meta.version)
            .map(([path, meta]) => `${path}\t${meta.version}\t${meta.integrity || ''}`)
            .sort();
          console.log('----- resolved frontend graph -----');
          console.log(rows.join('\n'));
          console.log('----- end resolved frontend graph -----');
          NODE
            exit 1
          fi

      - name: Install pinned frontend dependencies
        working-directory: web/operator
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck operator UI
        working-directory: web/operator
        run: npm run typecheck

      - name: Build operator UI
        working-directory: web/operator
        run: npm run build

      - name: Assert browser secret-storage policy
        shell: bash
        run: |
          if grep -R -n -E 'localStorage|sessionStorage' web/operator/src; then
            echo 'Browser-persistent storage is forbidden for the operator UI.'
            exit 1
          fi

      - name: Assert CSP-compatible generated HTML
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '<style' internal/operatorweb/dist/index.html
          while IFS= read -r line; do
            case "$line" in
              *'<script'* )
                case "$line" in
                  *' src='* ) ;;
                  * ) echo "inline script is forbidden: $line"; exit 1 ;;
                esac
                ;;
            esac
          done < internal/operatorweb/dist/index.html

      - name: Upload reproducible frontend output
        uses: actions/upload-artifact@v4
        with:
          name: operator-frontend-build
          if-no-files-found: error
          retention-days: 1
          path: |
            web/operator/package-lock.json
            internal/operatorweb/dist

      - name: Verify embedded frontend content matches the build
        shell: bash
        run: |
          set -euo pipefail
          cat internal/operatorweb/operator-dist.b64.* | tr -d '[:space:]' | base64 -d > /tmp/operator-dist-embedded.tar.gz
          test "$(sha256sum /tmp/operator-dist-embedded.tar.gz | cut -d' ' -f1)" = \
            'ba838f656d471a9630443156e64b7bfdafbf59fe1cbaf314271ff97596c48c16'
          rm -rf /tmp/operator-dist-embedded
          mkdir -p /tmp/operator-dist-embedded
          tar --no-same-owner -xzf /tmp/operator-dist-embedded.tar.gz -C /tmp/operator-dist-embedded
          diff -ru --no-dereference /tmp/operator-dist-embedded/dist internal/operatorweb/dist

  postgres-schema:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: sentinel-ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Bootstrap database roles
        env:
          PGPASSWORD: sentinel-ci-postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f db/bootstrap/roles.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres <<'SQL'
          CREATE ROLE sentinel_deploy_ci LOGIN PASSWORD 'sentinel-ci-deploy';
          GRANT sentinel_migrator TO sentinel_deploy_ci;
          CREATE ROLE sentinel_control_ci LOGIN PASSWORD 'sentinel-ci-control';
          GRANT sentinel_control TO sentinel_control_ci;
          CREATE DATABASE sentinel_ci OWNER sentinel_owner;
          SQL

      - name: Apply schema as migrator
        shell: bash
        env:
          PGPASSWORD: sentinel-ci-deploy
        run: |
          for migration in db/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sentinel_deploy_ci -d sentinel_ci -f "${migration}"
          done

      - name: Assert schema and privileges
        env:
          PGPASSWORD: sentinel-ci-postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d sentinel_ci -f db/ci/assertions.sql

      - name: PostgreSQL authority integration tests
        env:
          SENTINEL_TEST_POSTGRES_DSN: postgres://sentinel_control_ci@127.0.0.1:5432/sentinel_ci?sslmode=disable
          PGPASSWORD: sentinel-ci-control
        run: go test -race ./internal/postgresrepo -run '^TestIntegration' -count=1
