name: CI

on:
  push:
    branches:
      - main
      - 'wip/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false

      - name: Module tidy check
        shell: bash
        run: |
          go mod tidy
          changes="$(git status --porcelain -- go.mod go.sum)"
          if [ -n "$changes" ]; then
            echo "go.mod/go.sum are not tidy:"
            printf '%s\n' "$changes"
            echo
            git diff -- go.mod || true
            if [ -f go.sum ]; then
              echo "----- go.sum -----"
              cat go.sum
              echo "----- end go.sum -----"
            fi
            exit 1
          fi

      - name: Format check
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            printf '%s\n' "$files"
            echo
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...
